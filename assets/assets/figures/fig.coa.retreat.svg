<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Atkinson Hyperlegible, Arial, sans-serif" role="img" aria-label="A bar chart and table of average cliff retreat in metres per year at six sites. Site 1, clay: 1.8. Site 2, sandstone: 0.6. Site 3, chalk: 0.3. Site 4, boulder clay: 2.4. Site 5, granite: 0.05. Site 6, limestone: 0.2. The two clay sites retreat fastest; granite retreats slowest.">
