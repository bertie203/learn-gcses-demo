<text x="62.0" y="288.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1d2433">0.5</text>
<line x1="70" x2="650" y1="218.0" y2="218.0" stroke="#d9dce3"/>
<text x="62.0" y="222.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1d2433">1</text>
<line x1="70" x2="650" y1="152.0" y2="152.0" stroke="#d9dce3"/>
<text x="62.0" y="156.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1d2433">1.5</text>
