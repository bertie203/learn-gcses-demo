<text x="118.3" y="384.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">Clay</text>
<text x="215.0" y="368.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1d2433">2</text>
<text x="215.0" y="384.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555">Sandstone</text>
<text x="311.7" y="368.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1d2433">3</text>
