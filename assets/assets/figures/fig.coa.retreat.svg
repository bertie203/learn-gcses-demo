<text x="62.0" y="90.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1d2433">2</text>
<line x1="70" x2="650" y1="20.0" y2="20.0" stroke="#d9dce3"/>
<text x="62.0" y="24.0" font-size="12" text-anchor="end" font-weight="normal" fill="#1d2433">2.5</text>
<text x="18.0" y="185.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1d2433" transform="rotate(-90 18 185.0)">Cliff retreat (m per year)</text>
<rect x="89.3" y="112.4" width="58.0" height="237.6" fill="#2f6fdf"/>
<rect x="186.0" y="270.8" width="58.0" height="79.2" fill="#2f6fdf"/>
<rect x="282.7" y="310.4" width="58.0" height="39.6" fill="#2f6fdf"/>
